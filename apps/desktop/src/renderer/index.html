<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok Build Desktop</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#8A5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 17L12 22L22 17" stroke="#8A5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12L12 17L22 12" stroke="#8A5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="brand-title">Grok Build</span>
          <span class="brand-badge">Desktop</span>
        </div>
        <button id="btn-new-chat" class="btn-new-chat" title="New Session / Restart Agent">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          New Session
        </button>
      </div>

      <!-- Workspace Picker -->
      <div class="workspace-section">
        <label class="section-label">Active Workspace</label>
        <div id="workspace-card" class="workspace-card">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span id="workspace-path" class="workspace-path">Loading...</span>
          <button id="btn-change-workspace" class="btn-icon" title="Change Workspace Folder">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>
      </div>

      <!-- Sidebar Tabs: Files vs Shortcuts -->
      <div class="sidebar-tabs">
        <button id="tab-files" class="tab-btn active">Files</button>
        <button id="tab-quick" class="tab-btn">Quick Actions</button>
      </div>

      <!-- File Tree Explorer View -->
      <div id="view-files" class="sidebar-tab-content active">
        <div class="explorer-header">
          <span class="section-label">Workspace Files</span>
          <button id="btn-refresh-files" class="btn-icon" title="Refresh Tree">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
        <div id="file-tree-container" class="file-tree-container">
          <ul id="file-tree" class="file-tree">
            <li class="file-tree-loading">Scanning files...</li>
          </ul>
        </div>
      </div>

      <!-- Quick Actions View -->
      <div id="view-quick" class="sidebar-tab-content">
        <label class="section-label">Agent Commands</label>
        <div class="quick-prompts" style="margin-top: 8px;">
          <button class="quick-prompt-btn" data-cmd="Audit the codebase for potential bugs and performance issues">
            🔍 Audit codebase
          </button>
          <button class="quick-prompt-btn" data-cmd="Explain architecture">
            🏗️ Explain architecture
          </button>
          <button class="quick-prompt-btn" data-cmd="grok models">
            📋 List grok models
          </button>
          <button class="quick-prompt-btn" data-cmd="grok sessions">
            🕒 List sessions
          </button>
        </div>
      </div>

      <!-- Model Selector -->
      <div class="model-section">
        <label class="section-label">Agent Model</label>
        <select id="model-select" class="model-select">
          <option value="grok-4.5">grok-4.5 (Default)</option>
        </select>
      </div>

      <!-- Footer Info -->
      <div class="sidebar-footer">
        <div class="status-indicator">
          <span id="agent-status-dot" class="status-dot ready"></span>
          <span id="agent-status-text" class="status-text">Grok TUI Active</span>
        </div>
        <div class="version-tag">v0.2.106</div>
      </div>
    </aside>

    <!-- Main Workspace View -->
    <main class="main-content">
      <!-- Top Navbar -->
      <header class="top-nav">
        <div class="nav-title">
          <h2 id="current-session-title">Grok Build Agent TUI Workspace</h2>
          <span id="active-mode-badge" class="mode-badge">Native PTY Terminal</span>
        </div>
        <div class="nav-actions">
          <button id="btn-restart-pty" class="btn-secondary" title="Restart Grok TUI">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Restart Agent
          </button>
          <button id="btn-toggle-sandbox" class="btn-secondary active" title="Sandbox Status">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Sandbox Active
          </button>
        </div>
      </header>

      <!-- Terminal Xterm Container -->
      <section class="terminal-container">
        <div id="xterm-view" class="xterm-view"></div>
      </section>

      <!-- Prompt Send Bar -->
      <footer class="prompt-bar-container">
        <div class="prompt-bar">
          <textarea id="prompt-input" class="prompt-input" rows="1" placeholder="Type command or prompt for Grok agent... (Press Enter to send into TUI)"></textarea>
          <div class="prompt-actions">
            <div class="prompt-hints">
              <span class="hint-tag">@files</span>
              <span class="hint-tag">/commands</span>
            </div>
            <button id="btn-send-prompt" class="btn-send" title="Send into TUI">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- File Preview Modal -->
  <div id="file-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-file-title">file.rs</span>
        <div class="modal-actions">
          <button id="btn-attach-file" class="btn-secondary">Insert @Path into TUI</button>
          <button id="btn-close-modal" class="btn-icon">✕</button>
        </div>
      </div>
      <pre id="modal-file-body" class="modal-body">Loading...</pre>
    </div>
  </div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
